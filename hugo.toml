baseURL = 'https://Zero-Kq.github.io/Pages/'
locale = 'zh-CN'
title = 'Zero'
hasCJKLanguage = true
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS"]

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
    style = "gruvbox"
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [
            ["$$", "$$"],
            ["\\[", "\\]"]
          ]
          inline = [
            ["$", "$"],
            ["\\(", "\\)"]
          ]

[params]
  author = "Zero-Kq"
  brand = "ZERO"
  subtitle = "SPATIAL NOTES"
  description = "这里记录和学习 SLAM系统工程中的数学推导、源码拆解与开源项目记录以及看到的一些有意思的东西。"
  mainSections = ["posts"]
  github = "https://github.com/Zero-Kq"
  repo = "https://github.com/Zero-Kq/Pages"

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "posts"
  name = "博客"
  url = "/posts/"
  weight = 2

[[menu.main]]
  identifier = "projects"
  name = "学习系列"
  url = "/projects/"
  weight = 3

[[menu.main]]
  identifier = "archive"
  name = "时间轴"
  url = "/archive/"
  weight = 4

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 5
